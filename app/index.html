<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Brain</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #3b6ef6;
    --border: #e3e3df;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  select {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--card);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 720px;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
  }
  .user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
  }
  .assistant {
    align-self: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
  }
  .save-row { align-self: flex-start; margin-top: -6px; }
  .save-btn {
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .save-btn:hover { color: var(--accent); border-color: var(--accent); }
  .save-btn:disabled { cursor: default; color: var(--muted); border-color: var(--border); }
  form {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    background: var(--card);
    border-top: 1px solid var(--border);
  }
  input[type=text] {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button[type=submit] {
    padding: 10px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
  }
  button[type=submit]:disabled { opacity: 0.5; cursor: default; }
  .thinking { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
  <header>
    <h1>Second Brain</h1>
    <select id="vault">
      <option value="school">School</option>
      <option value="content" selected>Content</option>
      <option value="business">Business</option>
      <option value="all">All</option>
    </select>
  </header>

  <div id="messages"></div>

  <form id="chat-form">
    <input type="text" id="input" placeholder="Ask your second brain..." autocomplete="off" autofocus>
    <button type="submit" id="send">Send</button>
  </form>

<script>
  // Chat history lives only in this array. Refresh the page and it's gone.
  // Only notes you explicitly save persist to disk.
  const history = [];

  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const vaultEl = document.getElementById("vault");

  function addBubble(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addSaveButton(question, answer, suggestedVault) {
    const row = document.createElement("div");
    row.className = "save-row";
    const btn = document.createElement("button");
    btn.className = "save-btn";
    btn.textContent = "Save";
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = "Saving...";
      // When the dropdown is All, save to the vault the answer mostly
      // concerns (the server suggests it). Otherwise save to the selected vault.
      const vault = vaultEl.value === "all" ? suggestedVault : vaultEl.value;
      try {
        const res = await fetch("/api/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ vault, question, answer })
        });
        const data = await res.json();
        btn.textContent = data.saved ? "Saved to " + data.saved : "Error";
      } catch (e) {
        btn.textContent = "Error saving";
        btn.disabled = false;
      }
    };
    row.appendChild(btn);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    input.value = "";
    sendBtn.disabled = true;
    addBubble("user", question);
    history.push({ role: "user", content: question });

    const thinking = addBubble("assistant", "Thinking...");
    thinking.classList.add("thinking");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ vault: vaultEl.value, messages: history })
      });
      const data = await res.json();
      thinking.remove();
      if (data.error) {
        addBubble("assistant", "Error: " + data.error);
      } else {
        addBubble("assistant", data.answer);
        history.push({ role: "assistant", content: data.answer });
        addSaveButton(question, data.answer, data.suggested_vault);
      }
    } catch (err) {
      thinking.remove();
      addBubble("assistant", "Error: could not reach the server.");
    }
    sendBtn.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
