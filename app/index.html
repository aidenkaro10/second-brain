<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Second Brain">
<title>Second Brain</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5ae6'/><text x='50' y='68' font-size='52' text-anchor='middle'>🧠</text></svg>">
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1c1b22;
    --muted: #8a8794;
    --accent: #6d5ae6;
    --accent-soft: #efecff;
    --border: #e6e4de;
    --user-bubble: #6d5ae6;
    --user-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131217;
      --card: #1e1c26;
      --text: #eceaf2;
      --muted: #8f8c9c;
      --accent: #8d7bff;
      --accent-soft: #2a2547;
      --border: #2c2937;
      --user-bubble: #6d5ae6;
      --user-text: #ffffff;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  header {
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 10px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .title-row { display: flex; align-items: center; gap: 8px; }
  .title-row h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
  .title-row .brain { font-size: 20px; }
  .vaults {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .vaults::-webkit-scrollbar { display: none; }
  .vault-btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .vault-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    max-width: 260px;
  }
  .empty-state .big { font-size: 40px; margin-bottom: 8px; }
  .msg {
    max-width: min(680px, 88%);
    padding: 11px 15px;
    border-radius: 18px;
    line-height: 1.55;
    font-size: 15px;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 6px;
    white-space: pre-wrap;
  }
  .assistant {
    align-self: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
  }
  .assistant p { margin: 0 0 8px; }
  .assistant p:last-child { margin-bottom: 0; }
  .assistant ul, .assistant ol { margin: 0 0 8px 20px; }
  .assistant li { margin-bottom: 3px; }
  .assistant h1, .assistant h2, .assistant h3 {
    font-size: 15px; font-weight: 700; margin: 10px 0 6px;
  }
  .assistant code {
    background: var(--accent-soft);
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .assistant strong { font-weight: 700; }
  .thinking { color: var(--muted); }
  .thinking .dots::after {
    content: "";
    animation: dots 1.4s infinite;
  }
  @keyframes dots {
    0% { content: ""; } 25% { content: "."; }
    50% { content: ".."; } 75% { content: "..."; }
  }
  .save-row { align-self: flex-start; margin-top: -4px; }
  .save-btn {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border: none;
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .save-btn:disabled { opacity: 0.7; cursor: default; }
  form {
    display: flex;
    gap: 8px;
    padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
    background: var(--bg);
    border-top: 1px solid var(--border);
  }
  input[type=text] {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 16px;
    outline: none;
    background: var(--card);
    color: var(--text);
    min-width: 0;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button[type=submit] {
    width: 44px;
    height: 44px;
    flex: none;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button[type=submit]:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>
    <div class="title-row"><span class="brain">🧠</span><h1>Second Brain</h1></div>
    <div class="vaults" id="vaults">
      <button class="vault-btn" data-vault="school">School</button>
      <button class="vault-btn active" data-vault="content">Content</button>
      <button class="vault-btn" data-vault="business">Business</button>
      <button class="vault-btn" data-vault="all">All</button>
    </div>
  </header>

  <div id="messages">
    <div class="empty-state" id="empty">
      <div class="big">🧠</div>
      Ask anything you've saved.<br>
      Hooks, formats, class notes, business lessons.
    </div>
  </div>

  <form id="chat-form">
    <input type="text" id="input" placeholder="Ask your second brain..." autocomplete="off">
    <button type="submit" id="send" aria-label="Send">↑</button>
  </form>

<script>
  // Chat history lives only in this array. Refresh the page and it's gone.
  // Only notes you explicitly save persist to disk.
  const history = [];
  let vault = "content";

  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const emptyEl = document.getElementById("empty");

  // Vault pill switching
  document.getElementById("vaults").addEventListener("click", (e) => {
    const btn = e.target.closest(".vault-btn");
    if (!btn) return;
    document.querySelectorAll(".vault-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    vault = btn.dataset.vault;
  });

  // Tiny safe markdown renderer: escape all HTML first, then add back
  // formatting for bold, code, headers, and lists.
  function renderMarkdown(text) {
    let t = text
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    const lines = t.split("\n");
    let html = "", inList = null;
    const closeList = () => { if (inList) { html += "</" + inList + ">"; inList = null; } };
    for (const line of lines) {
      const ol = line.match(/^\s*\d+[.)]\s+(.*)/);
      const ul = line.match(/^\s*[-*]\s+(.*)/);
      const h = line.match(/^#{1,3}\s+(.*)/);
      if (ol) {
        if (inList !== "ol") { closeList(); html += "<ol>"; inList = "ol"; }
        html += "<li>" + ol[1] + "</li>";
      } else if (ul) {
        if (inList !== "ul") { closeList(); html += "<ul>"; inList = "ul"; }
        html += "<li>" + ul[1] + "</li>";
      } else if (h) {
        closeList(); html += "<h3>" + h[1] + "</h3>";
      } else if (line.trim() === "") {
        closeList();
      } else {
        closeList(); html += "<p>" + line + "</p>";
      }
    }
    closeList();
    return html;
  }

  function addBubble(role, text, asMarkdown) {
    if (emptyEl.parentNode) emptyEl.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;
    if (asMarkdown) div.innerHTML = renderMarkdown(text);
    else div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addSaveButton(question, answer, suggestedVault) {
    const row = document.createElement("div");
    row.className = "save-row";
    const btn = document.createElement("button");
    btn.className = "save-btn";
    btn.textContent = "Save to vault";
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = "Saving...";
      // When the pill is All, save to the vault the answer mostly
      // concerns (the server suggests it). Otherwise the selected vault.
      const target = vault === "all" ? suggestedVault : vault;
      try {
        const res = await fetch("/api/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ vault: target, question, answer })
        });
        const data = await res.json();
        btn.textContent = data.saved ? "Saved ✓ " + data.saved : "Error";
      } catch (e) {
        btn.textContent = "Error saving";
        btn.disabled = false;
      }
    };
    row.appendChild(btn);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    input.value = "";
    sendBtn.disabled = true;
    addBubble("user", question);
    history.push({ role: "user", content: question });

    const thinking = addBubble("assistant", "");
    thinking.classList.add("thinking");
    thinking.innerHTML = 'Thinking<span class="dots"></span>';

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ vault, messages: history })
      });
      const data = await res.json();
      thinking.remove();
      if (data.error) {
        addBubble("assistant", "Error: " + data.error);
      } else {
        addBubble("assistant", data.answer, true);
        history.push({ role: "assistant", content: data.answer });
        addSaveButton(question, data.answer, data.suggested_vault);
      }
    } catch (err) {
      thinking.remove();
      addBubble("assistant", "Error: could not reach the server.");
    }
    sendBtn.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
